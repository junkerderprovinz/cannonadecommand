name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # Built from source with the runner's Go: the action's prebuilt binary is
        # built with an older Go and refuses the module's go directive.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      # The injected scripts have no bundler to catch them, so they get a syntax
      # check plus the DOM-shim tests that replay Unraid's markup.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: js syntax
        run: find plugin/src -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: js dom tests
        run: |
          for t in plugin/test/*.test.js; do echo "== $t"; node "$t" || exit 1; done
